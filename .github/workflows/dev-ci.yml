name: Dev CI

on:
  push:
    branches: 
      - develop
  pull_request:
    branches: 
      - develop

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Run tests
        run: mvn -B test

      - name: Upload backend artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Tailwind/CSS/JS bundle)
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # Runs only after both builds succeed. Add your actual pre-prod
  # deploy commands here (SSH, SCP, Docker push, etc.)
  deploy-preprod:
    needs: [backend-build-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: artifacts/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/frontend

      - name: Deploy to pre-prod
        run: |
          echo "Add SSH/SCP/deploy-hook commands here to push artifacts to pre-prod server"
          # Example (SSH-based):
          # scp -i key.pem artifacts/backend/*.jar user@preprod-server:/app/
          # ssh -i key.pem user@preprod-server 'systemctl restart resume-analyser'
